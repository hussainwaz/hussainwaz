<svg width="800" height="70" viewBox="0 0 800 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="🌐 CONNECT WITH ME">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#00D9FF;#FF6B9D;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#FF6B9D;#7C3AED;#00D9FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="tglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#tg)" filter="url(#tglow)" letter-spacing="4">🌐 CONNECT WITH ME</text>
  <rect x="330" y="54" width="140" height="3" rx="1.5" fill="url(#tg)">
    <animate attributeName="width" values="60;140;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="370;330;370" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
