<svg width="900" height="10" viewBox="0 0 900 10" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" rx="1" fill="url(#dg)" opacity="0.4"/>
  <rect x="-200" y="3.5" width="200" height="3" rx="1.5" fill="url(#shine)">
    <animate attributeName="x" values="-200;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
