<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hussain Nawaz — Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#151a2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#00D9FF;#FF6B9D;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#FF6B9D;#7C3AED;#00D9FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF6B9D">
        <animate attributeName="stop-color" values="#FF6B9D;#7C3AED;#00D9FF;#FF6B9D" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7C3AED" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="900" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="897" height="297" rx="17" fill="none" stroke="url(#neon)" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- corner accents -->
  <path d="M 28 52 L 28 28 L 52 28" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 848 28 L 872 28 L 872 52" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 872 248 L 872 272 L 848 272" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 52 272 L 28 272 L 28 248" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>

  <!-- floating particles -->
  <circle cx="120" cy="80" r="3" fill="#00D9FF" opacity="0.7">
    <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="90" r="4" fill="#7C3AED" opacity="0.6">
    <animate attributeName="cy" values="90;115;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="225" r="3" fill="#FF6B9D" opacity="0.6">
    <animate attributeName="cy" values="225;205;225" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="215" r="2.5" fill="#00D9FF" opacity="0.7">
    <animate attributeName="cy" values="215;240;215" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- greeting -->
  <text x="450" y="88" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#8b949e" letter-spacing="8">✦ WELCOME TO MY UNIVERSE ✦</text>

  <!-- name -->
  <text x="450" y="162" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#neon)" filter="url(#glow)" letter-spacing="2">HUSSAIN NAWAZ</text>

  <!-- rotating roles -->
  <g font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="22" font-weight="600" text-anchor="middle">
    <text x="450" y="212" fill="#00D9FF" opacity="0">
      ⟨ Full-Stack Developer ⟩
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.36;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="212" fill="#7C3AED" opacity="0">
      ⟨ Game Developer ⟩
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.36;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="212" fill="#FF6B9D" opacity="0">
      ⟨ UI/UX Designer ⟩
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.36;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- status line -->
  <text x="450" y="252" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">📍 Pakistan &#160;·&#160; Building the next big thing 🚀</text>
</svg>
