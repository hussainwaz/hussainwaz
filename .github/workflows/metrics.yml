name: Generate metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate terminal-style metrics
        uses: lowlighter/metrics@latest
        with:
          # Create a classic PAT (no scopes needed for public data) and save it
          # as the METRICS_TOKEN repository secret for full stats. Falls back to
          # the default token, which covers most public metrics.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: hussainwaz
          template: terminal
          filename: github-metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_lines: yes
